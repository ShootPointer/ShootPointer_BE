spring:
  security:
    oauth2:
      client:
        provider:
          # kakao
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kauth.kakao.com/v2/user/me
            user-name-attribute: id

        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:test}
            client-secret: ${KAKAO_CLIENT_SECRET:test}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8081}
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email

#Kakao
kakao:
  auth:
    uri: https://kauth.kakao.com
  api:
    uri: https://kapi.kakao.com