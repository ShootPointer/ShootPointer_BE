encrypt:
  key: ${ENCRYPT_KEY:encrypt_key}
  server: ${SERVER_PORT:9000}

# -------------------------
# [JWT Settings]
# -------------------------

jwt:
  secret: ${JWT_SECRET:jwt}
  access_expiration_time: 86400000
  refresh_expiration_time: 259200000


spring:
  data:
    # Redis 설정
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  config:
    import:
      - postgres.yml
      - mongo.yml
      - log.yml
  output:
    ansi:
      enabled: always
  jackson:
    serialization:
      write-dates-as-timestamps: false
  main:
    allow-bean-definition-overriding: true
  application:
    name: shootpointer
  # Data 크기
  servlet:
    multipart:
      enabled: true
      max-file-size: 5000MB
      max-request-size: 5000MB
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        use_sql_comments: true
        show-sql: true

# Actuator 설정 (헬스체크용)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: false

---

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  health:
    # 로컬 환경에서는 Elasticsearch 헬스 체크 X
    elasticsearch:
      enabled: false